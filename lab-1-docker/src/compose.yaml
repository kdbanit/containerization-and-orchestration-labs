services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - 8082:8080
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro\
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.7.1
    ports:
      - 9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
  api:
    image: api:multi
    cpus: 0.5
    mem_limit: 128m
    memswap_limit: 128m
    ports:
      - "127.0.0.1:8081:8080"
volumes:
  prometheus_data: