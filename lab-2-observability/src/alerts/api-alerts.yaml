apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: api.rules
      rules:
        - alert: APIHighErrorRate
          expr: |
            100 *
            sum(rate(http_requests_total{job="monitoring-api",status=~"5.."}[2m]))
            /
            clamp_min(
              sum(rate(http_requests_total{job="monitoring-api"}[2m])),
              0.000001
            ) > 10
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "High HTTP 5xx error rate"
            description: "More than 10% of API requests return HTTP 5xx."
        
        - alert: APIHighLatency
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(http_request_duration_seconds_bucket{job="monitoring-api"}[5m])
              )
            ) > 2
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "High API response latency"
            description: "API p95 response time exceeds 2 seconds."

        - alert: APIDown
          expr: |
            (
              up{job="monitoring-api",namespace="default"} == 0
            )
            or
            absent(up{job="monitoring-api",namespace="default"})
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "API is unavailable"
            description: "The monitoring-api service is unreachable or has no active scrape targets."
