{{- $np := default dict .Values.postgres.networkPolicy }}
{{- if or ($np.ingress) ($np.egress) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  {{- if $np.ingress }}
  ingress:
    {{- range $np.ingress }}
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .matchPodLabels | nindent 14 }}
          {{- if .namespace }}
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          {{- end }}
      ports:
        {{- toYaml .ports | nindent 8 }}
    {{- end }}
  {{- end }}
  {{- if $np.egress }}
  egress:
    {{- range $np.egress }}
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .matchPodLabels | nindent 14 }}
          {{- if .namespace }}
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          {{- end }}
      ports:
        {{- toYaml .ports | nindent 8 }}
    {{- end }}
  {{- end }}

  policyTypes:
    {{- if $np.ingress }}
    - Ingress
    {{- end }}
    {{- if $np.egress }}
    - Egress
    {{- end }}
{{- end }}
