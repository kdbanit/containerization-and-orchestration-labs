apiVersion: batch/v1
kind: Job
metadata:
  name: k6
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: client
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:latest
          args:
            - run
            - --out
            - experimental-prometheus-rw
            - --tag
            - testid=12
            - /scripts/load.js
          env:
            - name: TARGET_URL
              value: "http://shop-api.shop.svc.cluster.local/health"
            - name: K6_PROMETHEUS_RW_SERVER_URL
              value: "http://kps-kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
            - name: K6_PROMETHEUS_RW_PUSH_INTERVAL
              value: "5s"
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: k6-script
